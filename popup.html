<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 260px;
        padding: 15px;
        font-family: sans-serif;
      }
      h3 {
        margin-top: 0;
        font-size: 16px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 8px;
      }
      .control-group {
        margin-bottom: 15px;
      }
      label {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin-bottom: 5px;
      }
      input[type="range"] {
        width: 100%;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h3>自定义字幕大小</h3>

    <div class="control-group">
      <label>
        <span>主字幕 (英文)</span>
        <span id="mainVal">1.8</span>rem
      </label>
      <input
        type="range"
        id="mainSize"
        min="0.5"
        max="5"
        step="0.1"
        value="1.8"
      />
    </div>

    <div class="control-group">
      <label>
        <span>翻译 (中文)</span>
        <span id="transVal">1.5</span>rem
      </label>
      <input
        type="range"
        id="transSize"
        min="0.5"
        max="4"
        step="0.1"
        value="1.5"
      />
    </div>

    <script src="popup.js"></script>
  </body>
</html>
